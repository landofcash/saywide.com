services:
  postgres:
    image: postgres:18
    container_name: saywide-postgres
    environment:
      POSTGRES_DB: saywide
      POSTGRES_USER: saywide
      POSTGRES_PASSWORD: saywide_dev
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saywide -d saywide"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - saywide_postgres_data:/var/lib/postgresql

volumes:
  saywide_postgres_data:
